[project]
name = "railinsight"
version = "0.1.0"
description = "Analyse exploratoire du CSV de régularité mensuelle des TGV"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<4",
    "matplotlib>=3.8,<4",
    "jupyterlab>=4,<5",
    "ipykernel>=6,<8",
    "streamlit>=1.66.0",
    "plotly>=7.1.0",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.6",
    "dotenv>=0.9.9",
    "psycopg2-binary>=2.9.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/railinsight"]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "interrogate>=1.7.0",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 188
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.black]
line-length = 188
target-version = ["py311"]

[tool.interrogate]
fail-under = 40
ignore-init-method = true
ignore-init-module = true
exclude = ["tests"]
verbose = 1

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=5"

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
fail_under = 5

[tool.uv]
override-dependencies = [
    "pillow>=13.0.0",
    "filelock>=4.2.1",
    "certifi>=2026.10.18"
]