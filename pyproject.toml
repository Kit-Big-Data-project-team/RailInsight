[project]
name = "railinsight"
version = "0.1.0"
description = "Analyse exploratoire du CSV de régularité mensuelle des TGV"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<4",
    "streamlit>=1.66.0",
    "plotly>=7.1.0",
    "pydeck>=0.9.0",
    "certifi>=2024.0.0",
    "filelock>=3.13.0",
    "pillow>=10.3.0",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.6",
    "dotenv>=0.9.9",
    "psycopg2-binary>=2.9.13",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/railinsight"]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "interrogate>=1.7.0",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "sphinx>=8.1.0",
    "sphinx-autodoc-typehints>=3.6.1",
    "sphinx-design>=0.8.0",
    "sphinx-rtd-theme>=3.0.0",
]
# Outils de notebook pour l'exploration ad hoc : hors exécution de l'application
# et hors CI (ne pas installer par défaut).
notebook = [
    "matplotlib>=3.8,<4",
    "jupyterlab>=4,<5",
    "ipykernel>=6,<8",
]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.black]
line-length = 160
target-version = ["py311"]

[tool.interrogate]
fail-under = 80
ignore-init-method = true
ignore-init-module = true
exclude = ["tests"]
verbose = 1

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["src/railinsight/data/inspect_prediction_data.py"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.uv]
override-dependencies = [
    "pillow>=13.0.0",
    "filelock>=4.2.1",
    "certifi>=2026.10.18",
    "tornado>=6.6.1",
    "soupsieve>=4.0.0"
]
